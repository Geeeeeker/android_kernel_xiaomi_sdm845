name: Build static usbip for arm64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04   # 固定版本，避免意外
    steps:
      - name: Install dependencies and cross toolchain
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            flex bison libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libudev-dev:arm64 libssl-dev:arm64 \
            libudev-static:arm64 libssl-static:arm64 || true   # 尝试安装静态库（可能不存在）

      - name: Download Linux kernel 4.9.337
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
          tar -xf linux-4.9.337.tar.xz

      - name: Verify usbip source directory
        run: |
          ls -la linux-4.9.337/tools/usb/usbip
          test -f linux-4.9.337/tools/usb/usbip/autogen.sh || { echo "autogen.sh missing"; exit 1; }

      - name: Run autogen.sh
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          ./autogen.sh
          # 检查是否生成了 configure 脚本
          ls -la configure

      - name: Configure for static cross build
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          export CC=aarch64-linux-gnu-gcc
          export AR=aarch64-linux-gnu-ar
          # 将静态标志传递给 LDFLAGS，并添加 pthread
          ./configure \
            --host=aarch64-linux-gnu \
            --prefix=/tmp/install \
            --with-tcp-wrappers=no \
            CFLAGS="-static" \
            LDFLAGS="-static -pthread" \
            LIBS="-ludev -lssl -lcrypto"   # 显式指定需要链接的库（如果有）
          # 保存 config.log 供后续调试
          cp config.log $HOME/config.log

      - name: Build usbip and usbipd
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          make V=1 -j$(nproc)   # V=1 输出详细编译信息

      - name: Verify binaries
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          file src/usbip src/usbipd
          aarch64-linux-gnu-readelf -d src/usbip src/usbipd | grep NEEDED || echo "No dynamic deps"
          aarch64-linux-gnu-strip src/usbip src/usbipd

      - name: Upload config.log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-log
          path: ${{ github.workspace }}/config.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: |
            linux-4.9.337/tools/usb/usbip/src/usbip
            linux-4.9.337/tools/usb/usbip/src/usbipd

name: Build static usbip for arm64 (with ZIP packaging)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip in arm64 container
        run: |
          mkdir -p ${{ github.workspace }}/output

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译工具和依赖包
              apt update
              apt install -y \
                build-essential \
                autoconf \
                automake \
                libtool \
                pkg-config \
                wget \
                xz-utils \
                flex \
                bison \
                libncurses-dev \
                git \
                ca-certificates \
                gperf \
                libudev-dev \
                libssl-dev

              # ------------------------------------------------------------
              # 检查系统是否已提供静态库
              # ------------------------------------------------------------
              echo '=== Checking for static libraries ==='
              ls -la /usr/lib/aarch64-linux-gnu/libudev.a || echo 'libudev.a not found, will compile eudev'
              ls -la /usr/lib/aarch64-linux-gnu/libssl.a || echo 'libssl.a should be provided by libssl-dev'

              # 如果 libudev.a 不存在，则编译 eudev
              if [ ! -f /usr/lib/aarch64-linux-gnu/libudev.a ]; then
                echo '=== Compiling eudev static library ==='
                cd /tmp
                wget https://github.com/eudev-project/eudev/archive/refs/tags/v3.2.14.tar.gz -O eudev-3.2.14.tar.gz
                tar xzf eudev-3.2.14.tar.gz
                cd eudev-3.2.14
                ./autogen.sh
                ./configure --prefix=/usr --libdir=/usr/lib/aarch64-linux-gnu --enable-static --disable-shared --disable-manpages
                make -j\$(nproc)
                make install
              fi

              # ------------------------------------------------------------
              # 下载内核源码并编译 usbip
              # ------------------------------------------------------------
              cd /workspace
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar xf linux-4.9.337.tar.xz
              cd linux-4.9.337/tools/usb/usbip

              ./autogen.sh
              # 配置静态编译，禁用警告转错误
              ./configure \
                CFLAGS=\"-static -Wno-error\" \
                LDFLAGS=\"-static\" \
                --with-tcp-wrappers=no
              make -j\$(nproc)

              # ------------------------------------------------------------
              # 验证并复制二进制
              # ------------------------------------------------------------
              echo '=== Verification inside container ==='
              file src/usbip
              file src/usbipd
              readelf -d src/usbip 2>&1 | grep NEEDED || echo 'usbip is statically linked'
              readelf -d src/usbipd 2>&1 | grep NEEDED || echo 'usbipd is statically linked'

              cp src/usbip /workspace/output/
              cp src/usbipd /workspace/output/
              echo 'Binaries copied to /workspace/output/'
            "

      - name: Install aarch64 binutils for host verification
        run: sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Verify binaries on host
        run: |
          echo '=== Host verification ==='
          file output/usbip
          file output/usbipd
          aarch64-linux-gnu-readelf -d output/usbip | grep NEEDED || echo 'usbip: statically linked'
          aarch64-linux-gnu-readelf -d output/usbipd | grep NEEDED || echo 'usbipd: statically linked'

      - name: Create ZIP archive with all files
        run: |
          # 根据您的需求，将所有生成的文件（包括可能的其他依赖）打包
          # 当前只有 usbip 和 usbipd，如有其他文件（如 vhci-core、vhci-hc）可添加
          mkdir -p release
          cp output/* release/
          # 如果存在其他文件，请在此处添加复制命令，例如：
          # cp /path/to/vhci-core release/
          # cp /path/to/vhci-hc release/
          zip -j usbip-static-arm64.zip release/*

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: usbip-static-arm64.zip

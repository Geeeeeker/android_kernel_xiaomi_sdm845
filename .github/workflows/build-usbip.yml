name: Build static usbip for arm64 (QEMU + container)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip statically in arm64 container
        run: |
          mkdir -p ${{ github.workspace }}/output

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译工具及静态库依赖
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                flex \
                bison \
                libncurses-dev \
                wget \
                xz-utils \
                gperf \
                perl \
                linux-libc-dev:arm64

              # ------------------------------------------------------------
              # 1. 编译安装 eudev (提供 libudev 静态库)
              # ------------------------------------------------------------
              cd /tmp
              wget https://github.com/eudev-project/eudev/archive/refs/tags/v3.2.14.tar.gz -O eudev-3.2.14.tar.gz
              tar xzf eudev-3.2.14.tar.gz
              cd eudev-3.2.14
              echo '=== Current directory content before autogen ==='
              ls -la
              echo '=== Running autogen.sh ==='
              ./autogen.sh
              AUTOGEN_EXIT_CODE=\$?
              echo \"autogen.sh exit code: \$AUTOGEN_EXIT_CODE\"
              if [ ! -f configure ]; then
                echo '=== autogen.sh did not produce configure. Attempting autoreconf -i ==='
                autoreconf -i
                if [ ! -f configure ]; then
                  echo 'ERROR: configure still not generated after autoreconf.'
                  exit 1
                fi
              fi
              echo '=== configure generated successfully ==='
              # 关键：静态编译，禁用 man 页面生成
              ./configure --prefix=/usr --libdir=/usr/lib/aarch64-linux-gnu --enable-static --disable-shared --disable-manpages
              make -j\$(nproc)
              make install

              # ------------------------------------------------------------
              # 2. 编译安装 OpenSSL (提供 libssl, libcrypto 静态库)
              # ------------------------------------------------------------
              cd /tmp
              wget https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz -O openssl-1.1.1w.tar.gz
              tar xzf openssl-1.1.1w.tar.gz
              cd openssl-OpenSSL_1_1_1w
              ./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib/aarch64-linux-gnu no-shared
              make -j\$(nproc)
              make install

              # ------------------------------------------------------------
              # 3. 下载内核源码并编译 usbip (静态链接)
              # ------------------------------------------------------------
              cd /workspace
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar -xf linux-4.9.337.tar.xz

              cd linux-4.9.337/tools/usb/usbip

              # 生成 configure 脚本
              ./autogen.sh

              # 配置：静态链接，禁用警告转错误，禁用 tcp-wrappers
              ./configure \
                CFLAGS=\"-Wno-error -Wno-error=stringop-truncation\" \
                LDFLAGS=\"-static\" \
                --with-tcp-wrappers=no

              # 编译
              make -j\$(nproc)

              # 检查并复制静态链接的二进制文件
              echo \"=== Checking built binaries ===\"
              ls -la src/.libs/
              if [ ! -f src/.libs/usbip ] || [ ! -f src/.libs/usbipd ]; then
                echo \"ERROR: ELF binaries not found in src/.libs/\"
                exit 1
              fi

              # 复制二进制文件到输出目录
              cp src/.libs/usbip /workspace/output/
              cp src/.libs/usbipd /workspace/output/
            "

      - name: Install aarch64 binutils for verification
        run: sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Verify binaries are statically linked
        run: |
          echo "=== File information ==="
          file output/usbip
          file output/usbipd
          echo "=== Check for INTERP section (should be absent) ==="
          aarch64-linux-gnu-readelf -l output/usbip | grep INTERP || echo "No INTERP section -> statically linked"
          aarch64-linux-gnu-readelf -l output/usbipd | grep INTERP || echo "No INTERP section -> statically linked"
          echo "=== Dynamic dependencies (should be none) ==="
          aarch64-linux-gnu-readelf -d output/usbip 2>&1 | grep NEEDED || echo "No NEEDED entries -> statically linked"
          aarch64-linux-gnu-readelf -d output/usbipd 2>&1 | grep NEEDED || echo "No NEEDED entries -> statically linked"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: output/

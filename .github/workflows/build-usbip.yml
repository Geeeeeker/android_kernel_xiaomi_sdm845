name: Build static usbip for arm64 (autotools)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies and cross toolchain
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            flex bison libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libudev-dev:arm64 libssl-dev:arm64

      - name: Download Linux kernel 4.9.337
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
          tar xf linux-4.9.337.tar.xz

      - name: Generate configure script
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          ./autogen.sh

      - name: Configure for static cross build
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          export CC=aarch64-linux-gnu-gcc
          export AR=aarch64-linux-gnu-ar
          ./configure \
            --host=aarch64-linux-gnu \
            --prefix=/tmp/install \
            --with-tcp-wrappers=no \
            CFLAGS="-static -pthread" \
            LDFLAGS="-static"

      - name: Build usbip and usbipd
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          make V=1 -j$(nproc)

      - name: Verify binaries
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          file src/usbip src/usbipd
          aarch64-linux-gnu-readelf -d src/usbip src/usbipd | grep NEEDED || echo "No dynamic dependencies"
          aarch64-linux-gnu-strip src/usbip src/usbipd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: |
            linux-4.9.337/tools/usb/usbip/src/usbip
            linux-4.9.337/tools/usb/usbip/src/usbipd

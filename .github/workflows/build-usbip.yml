name: Build dynamic usbip for arm64 (QEMU + ARM64 container)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip in arm64 container (dynamic linking)
        run: |
          mkdir -p ${{ github.workspace }}/output

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译依赖
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev \
                libssl-dev \
                flex \
                bison \
                libncurses-dev \
                wget \
                xz-utils \
                file

              # 下载内核源码
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar -xf linux-4.9.337.tar.xz

              # 进入 usbip 源码目录
              cd linux-4.9.337/tools/usb/usbip

              # 生成 configure 脚本
              ./autogen.sh

              # 配置（动态编译，禁用 -Werror）
              ./configure \
                CFLAGS='-Wno-error' \
                --with-tcp-wrappers=no \
                --host=aarch64-linux-gnu

              # 编译
              make -j\$(nproc)

              # 检查生成的二进制文件（在容器内）
              echo '=== Build output files ==='
              ls -la src/
              echo '=== File type ==='
              file src/usbip
              file src/usbipd
              echo '=== ELF header (readelf -h) ==='
              readelf -h src/usbip || echo 'readelf failed'
              echo '=== Dynamic dependencies (readelf -d) ==='
              readelf -d src/usbip | grep NEEDED || echo 'No NEEDED section (possibly statically linked?)'

              # 复制到输出目录
              cp src/usbip /workspace/output/
              cp src/usbipd /workspace/output/
            "

      - name: Install ARM64 binutils for verification (on host)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu file

      - name: Verify binaries (on host)
        run: |
          echo '=== Host verification ==='
          ls -l output/
          file output/usbip
          file output/usbipd
          echo '=== Dynamic dependencies ==='
          aarch64-linux-gnu-readelf -d output/usbip | grep NEEDED || echo 'No NEEDED (static?)'
          aarch64-linux-gnu-readelf -d output/usbipd | grep NEEDED || echo 'No NEEDED (static?)'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-dynamic-arm64
          path: output/

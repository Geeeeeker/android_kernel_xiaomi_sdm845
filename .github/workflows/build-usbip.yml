name: Build static usbip for arm64 (Ubuntu 22.04)

on:
  workflow_dispatch:   # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04   # 明确使用 Ubuntu 22.04

    steps:
      - name: Checkout (create workspace)
        uses: actions/checkout@v4

      - name: Add arm64 architecture and switch to ports.ubuntu.com
        run: |
          sudo dpkg --add-architecture arm64
          # 将所有源替换为 ports.ubuntu.com（支持 arm64 和 amd64）
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|http://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list
          sudo apt update

      - name: Install dependencies and cross toolchain
        run: |
          sudo apt install -y \
            build-essential autoconf libtool pkg-config flex bison libncurses-dev \
            wget xz-utils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libudev-dev:arm64 libssl-dev:arm64

      - name: Download Linux kernel 4.9.337 source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
          tar -xf linux-4.9.337.tar.xz

      - name: Configure and build usbip statically
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          chmod +x autogen.sh
          ./autogen.sh

          export CC=aarch64-linux-gnu-gcc
          export AR=aarch64-linux-gnu-ar
          export CFLAGS="-static"
          export LDFLAGS="-static"

          ./configure \
            --host=aarch64-linux-gnu \
            --with-tcp-wrappers=no \
            --prefix=/tmp/install

          make -j$(nproc)

      - name: Verify and strip binaries
        working-directory: linux-4.9.337/tools/usb/usbip
        run: |
          file src/usbip
          file src/usbipd
          aarch64-linux-gnu-strip src/usbip src/usbipd
          echo "After strip:"
          file src/usbip
          file src/usbipd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: |
            linux-4.9.337/tools/usb/usbip/src/usbip
            linux-4.9.337/tools/usb/usbip/src/usbipd

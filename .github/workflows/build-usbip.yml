name: Build static usbip for arm64 (QEMU + container, compile deps from source)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip in arm64 container
        run: |
          mkdir -p ${{ github.workspace }}/output

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装所有必要的编译工具和依赖（包含 xsltproc 以支持 autogen.sh）
              apt update
              apt install -y \
                build-essential \
                autoconf \
                automake \
                libtool \
                pkg-config \
                wget \
                xz-utils \
                flex \
                bison \
                libncurses-dev \
                git \
                ca-certificates \
                gperf \
                libblkid-dev \
                libselinux-dev \
                libglib2.0-dev \
                libgirepository1.0-dev \
                util-linux \
                xsltproc \
                docbook-xsl

              # ------------------------------------------------------------
              # 1. 编译安装 eudev (提供 libudev 静态库) - 增加 --disable-manpages
              # ------------------------------------------------------------
              cd /tmp
              wget https://github.com/eudev-project/eudev/archive/refs/tags/v3.2.14.tar.gz -O eudev-3.2.14.tar.gz
              tar xzf eudev-3.2.14.tar.gz
              cd eudev-3.2.14

              echo '=== Current directory content before autogen ==='
              ls -la

              echo '=== Running autogen.sh ==='
              ./autogen.sh
              AUTOGEN_EXIT_CODE=\$?
              echo \"autogen.sh exit code: \$AUTOGEN_EXIT_CODE\"

              if [ ! -f configure ]; then
                echo '=== autogen.sh did not produce configure. Attempting autoreconf -i ==='
                autoreconf -i
                if [ ! -f configure ]; then
                  echo 'ERROR: configure still not generated after autoreconf.'
                  exit 1
                fi
              fi

              echo '=== configure generated successfully ==='
              # 关键修改：添加 --disable-manpages 跳过 man 页面生成
              ./configure --prefix=/usr --libdir=/usr/lib/aarch64-linux-gnu --enable-static --disable-shared --disable-manpages
              make -j\$(nproc)
              make install

              # ------------------------------------------------------------
              # 2. 编译安装 OpenSSL (提供 libssl, libcrypto 静态库)
              # ------------------------------------------------------------
              cd /tmp
              wget https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz -O openssl-1.1.1w.tar.gz
              tar xzf openssl-1.1.1w.tar.gz
              cd openssl-OpenSSL_1_1_1w
              ./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib/aarch64-linux-gnu no-shared
              make -j\$(nproc)
              make install

              # ------------------------------------------------------------
              # 3. 下载内核源码并编译 usbip
              # ------------------------------------------------------------
              cd /workspace
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar xf linux-4.9.337.tar.xz
              cd linux-4.9.337/tools/usb/usbip

              ./autogen.sh
              ./configure \
                CFLAGS=\"-static -Wno-error\" \
                LDFLAGS=\"-static\" \
                --with-tcp-wrappers=no
              make -j\$(nproc)

              # ------------------------------------------------------------
              # 4. 在容器内验证编译产物
              # ------------------------------------------------------------
              echo '=== Verification inside container ==='
              if [ ! -f src/usbip ] || [ ! -f src/usbipd ]; then
                echo 'ERROR: Binary files not found!'
                exit 1
              fi

              file src/usbip
              file src/usbipd
              hexdump -C src/usbip | head -n 2 || true
              hexdump -C src/usbipd | head -n 2 || true
              readelf -d src/usbip 2>&1 | grep NEEDED || echo 'No NEEDED entries (statically linked)'
              readelf -d src/usbipd 2>&1 | grep NEEDED || echo 'No NEEDED entries (statically linked)'

              # ------------------------------------------------------------
              # 5. 复制到输出目录
              # ------------------------------------------------------------
              cp src/usbip /workspace/output/
              cp src/usbipd /workspace/output/
              echo 'Binaries copied to /workspace/output/'
            "

      - name: Install aarch64 binutils for host verification
        run: sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Verify binaries on host
        run: |
          echo '=== Host verification ==='
          file output/usbip
          file output/usbipd
          aarch64-linux-gnu-readelf -d output/usbip | grep NEEDED || echo 'usbip: statically linked'
          aarch64-linux-gnu-readelf -d output/usbipd | grep NEEDED || echo 'usbipd: statically linked'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: output/

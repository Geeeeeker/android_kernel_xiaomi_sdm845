name: Build static usbip & usbipd (kbuild)

on:
  workflow_dispatch:        # 允许手动触发
  push:
    branches: [ main ]      # 可根据需要修改分支

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 安装交叉编译工具链及必要依赖
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            crossbuild-essential-arm64 \
            flex bison \
            libssl-dev \
            bc \
            wget \
            xz-utils \
            file

      # 2. 下载指定的 Linux 内核源码包
      - name: Download Linux kernel 4.9.337 source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
          tar xf linux-4.9.337.tar.xz

      # 3. 生成内核配置文件（usbip 编译需要内核头文件）
      - name: Generate kernel config
        working-directory: linux-4.9.337
        run: |
          make ARCH=arm64 defconfig

      # 4. 静态交叉编译 usbip 和 usbipd
      - name: Build usbip and usbipd
        working-directory: linux-4.9.337
        run: |
          export LDFLAGS="-static"          # 强制静态链接
          make CROSS_COMPILE=aarch64-linux-gnu- \
               ARCH=arm64 \
               -C tools/usb/usbip \
               -j$(nproc)

      # 5. 验证生成的二进制文件是否为静态链接
      - name: Verify static linking
        run: |
          echo "=== File information ==="
          file linux-4.9.337/tools/usb/usbip/usbip
          file linux-4.9.337/tools/usb/usbip/usbipd
          echo "=== Dynamic dependencies (should be none) ==="
          aarch64-linux-gnu-readelf -d linux-4.9.337/tools/usb/usbip/usbip | grep NEEDED || echo "usbip is statically linked"
          aarch64-linux-gnu-readelf -d linux-4.9.337/tools/usb/usbip/usbipd | grep NEEDED || echo "usbipd is statically linked"

      # 6. 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: |
            linux-4.9.337/tools/usb/usbip/usbip
            linux-4.9.337/tools/usb/usbip/usbipd

name: Build kernelsu-susfs
on:
  workflow_dispatch:
    inputs:
      codename:
        required: true
        type: string
        default: 'lineage_raphael'
      repo:
        required: true
        type: string
        default: 'android_kernel_xiaomi_sm8150_419'

env:
  # 工具链配置（沿用 ksu-11 的 AOSP Clang）
  AOSP_TOOLCHAIN_BRANCH: android11-release
  AOSP_CLANG_VERSION: r383902b

jobs:
  build-kernelsu-susfs:
    runs-on: ubuntu-latest
    env:
      # 通用构建环境
      CCACHE_MAXSIZE: "2G"
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # 内核与设备配置
      KERNEL_SOURCE: "https://github.com/Geeeeeker/${{ inputs.repo }}"
      KERNEL_BRANCH: "lineage-23.0_raphael"
      KERNEL_VERSION: "4.9"                # 改为 4.9
      KERNEL_DEFCONFIG: "vendor/sm8150-perf_defconfig"
      DEVICE_CODENAME: "raphael"
      KERNEL_DIR: "device_kernel"

      # KernelSU 配置（使用官方集成脚本）
      KERNELSU_VERSION: "v0.9.5"           # 或 latest
      
      # SUSFS 配置
      SUSFS_ENABLE: "true"
      SUSFS_SOURCE: "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "kernel-4.9"           # 改为 kernel-4.9

      # AnyKernel3 配置
      AK3_SOURCE: "https://github.com/ayuschatterjee/AnyKernel3"
      AK3_BRANCH: "master"

    steps:                               
      - name: 安装依赖包
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git git-lfs \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev \
            device-tree-compiler python3 unzip xz-utils zlib1g-dev

      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-${{ env.DEVICE_CODENAME }}
          max-size: ${{ env.CCACHE_MAXSIZE }}

      - name: 缓存 Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载 Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang &&
          curl -LSs "https://github.com/Geeeeeker/boot/releases/download/clang-prebuilts-20260319-031015/clang-${{ env.AOSP_CLANG_VERSION }}.tar.gz" |
          tar xz -C clang

      - name: 克隆内核源码与依赖
        run: |
          git clone --depth=1 --branch ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} ${{ env.KERNEL_DIR }}
          git clone --depth=1 --branch ${{ env.AK3_BRANCH }} ${{ env.AK3_SOURCE }} AnyKernel3
          if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
            git clone --depth=1 --branch ${{ env.SUSFS_BRANCH }} ${{ env.SUSFS_SOURCE }} susfs4ksu
          fi

      - name: 集成 KernelSU（官方脚本）
        working-directory: ./${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ env.KERNELSU_VERSION }}" = "latest" ]; then
            KSU_VER=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | jq -r .tag_name)
          else
            KSU_VER="${{ env.KERNELSU_VERSION }}"
          fi
          echo "KERNELSU_VERSION=$KSU_VER" >> $GITHUB_ENV
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s -- $KSU_VER

      - name: 应用 SUSFS 补丁
        if: env.SUSFS_ENABLE == 'true'
        run: |
          cd ./${{ env.KERNEL_DIR }}
          # 复制 SUSFS 核心文件
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          # 应用 SUSFS 主补丁
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-${{ env.KERNEL_VERSION }}.patch ./
          patch -p1 < 50_add_susfs_in_kernel-${{ env.KERNEL_VERSION }}.patch || true
          
          # 应用 KernelSU 与 SUSFS 的桥接补丁
          cd ../KernelSU/
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
          patch -p1 < 10_enable_susfs_for_ksu.patch || true

      - name: 配置内核选项（参考 ksu-11 增强）
        working-directory: ./${{ env.KERNEL_DIR }}
        run: |
          DEFCONFIG="arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}"

          # 基础优化
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' $DEFCONFIG
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' $DEFCONFIG
          sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' $DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG
          echo "CONFIG_CC_WERROR=n" >> $DEFCONFIG

          # 内存与 IPC 支持
          echo "CONFIG_ASHMEM=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_COMPAT=y" >> $DEFCONFIG
          echo "CONFIG_EPOLL=y" >> $DEFCONFIG
          echo "CONFIG_EVENTFD=y" >> $DEFCONFIG
          echo "CONFIG_SIGNALFD=y" >> $DEFCONFIG
          echo "CONFIG_INOTIFY_USER=y" >> $DEFCONFIG
          echo "CONFIG_SHMEM=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG

          # USB/IP 支持
          echo "CONFIG_USBIP_CORE=y" >> $DEFCONFIG
          echo "CONFIG_USBIP_VHCI_HCD=y" >> $DEFCONFIG
          echo "CONFIG_USBIP_HOST=y" >> $DEFCONFIG

          # Backlight
          echo "CONFIG_BACKLIGHT_CLASS_DEVICE=y" >> $DEFCONFIG
          echo "CONFIG_BACKLIGHT_QCOM=y" >> $DEFCONFIG

          # ZRAM zstd
          echo "CONFIG_ZRAM=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_ZSTD=y" >> $DEFCONFIG

          # APatch / KernelSU 符号支持
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG

          # USB 串口驱动
          echo "CONFIG_USB_SERIAL=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CONSOLE=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_GENERIC=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CH341=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_FTDI_SIO=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CP210X=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_PL2303=y" >> $DEFCONFIG

          # 禁用 MODVERSIONS（KernelSU 要求）
          sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' $DEFCONFIG
          echo "# CONFIG_MODVERSIONS is not set" >> $DEFCONFIG

          # 启用 SUSFS 配置
          if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
            echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          fi

      - name: 编译内核
        working-directory: ./${{ env.KERNEL_DIR }}
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          
          make O=out ${{ env.KERNEL_DEFCONFIG }} CC="ccache clang"
          make O=out -j$(nproc --all) CC="ccache clang" LD=ld.lld KCFLAGS="-Wno-unknown-warning-option"
          
          cp out/arch/arm64/boot/Image ../AnyKernel3/ || cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/

      - name: 打包内核为刷机包
        working-directory: ./AnyKernel3
        run: |
          KSU_VER=$(cd ../${{ env.KERNEL_DIR }}/KernelSU 2>/dev/null && git rev-parse --short HEAD || echo "${{ env.KERNELSU_VERSION }}")
          ZIP_NAME="Kernel-sm8150-raphael-KSU-${KSU_VER}-$(date +%Y%m%d).zip"
          zip -r9 "../${ZIP_NAME}" *
          echo "OUTPUT_ZIP=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Created kernel zip: ${ZIP_NAME}"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_ZIP }}

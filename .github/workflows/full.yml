name: 编译内核 (非GKI + KSU Next + SUSFS)

on:
  workflow_dispatch:

env:
  AOSP_TOOLCHAIN_BRANCH: android11-release
  AOSP_CLANG_VERSION: r383902b

jobs:
  build:
    name: 编译内核
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - name: 安装软件包
        run: |
          sudo apt update
          sudo apt install -y ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi flex bison libssl-dev bc

      - name: 同步内核源码
        uses: actions/checkout@v4
        with:
          path: kernel
          # 这里替换成你自己的非GKI内核仓库地址
          repository: yourname/android_kernel_xiaomi_sdm845
          ref: lineage-18.1

      - name: 集成 KernelSU Next
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          cd KernelSU-Next
          KSU_VERSION=$(expr $(git rev-list --count HEAD) "+" 10200)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: 手动应用 SUSFS 补丁 (适配 4.9 非GKI)
        working-directory: kernel
        run: |
          # 克隆适配了 4.9 的 SUSFS 补丁仓库（示例，实际请使用你信任的源）
          git clone https://github.com/ShirkNeko/susfs4ksu.git -b non-gki-4.9 ../susfs4ksu
          # 复制补丁文件
          cp ../susfs4ksu/kernel_patches/50_add_susfs.patch ./
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          # 应用主补丁
          patch -p1 < 50_add_susfs.patch || true
          # 应用 KernelSU 的 SUSFS 使能补丁
          cd KernelSU-Next
          patch -p1 < ../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch || true
          cd ..
          # 其他修复补丁
          # 可根据需要添加

      - name: 缓存 Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载 Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -LSs "https://github.com/Geeeeeker/boot/releases/download/clang-prebuilts-20260319-031015/clang-r383902b.tar.gz" | tar xz -C clang

      - name: 缓存 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-dipper
          max-size: 5G

      - name: 配置内核选项
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/dipper_defconfig"
          # 启用 KernelSU 和 SUSFS
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          # 其他必要配置（如 OverlayFS）
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' $DEFCONFIG

      - name: 编译内核
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out dipper_defconfig
          make -j$(nproc --all) O=out CC="ccache clang" LLVM=1 LLVM_IAS=1

      - name: 打包 AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          zip -r9 AnyKernel3-dipper-KSU-Next-SUSFS.zip * -x .git README.md

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-dipper
          path: ak3/*.zip

name: 编译内核

on:
  push:
    branches:
      - dev/*
      - stable/*
    tags:
      - 'v*'                     # tag 触发，用于 release
  workflow_dispatch:

env:
  AOSP_TOOLCHAIN_BRANCH: android11-release
  AOSP_CLANG_VERSION: r383902b

jobs:
  build:
    name: 编译内核
    permissions: { contents: write }
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - dipper
    steps:
      - name: 安装软件包
        env:
          PACKAGES: ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi
        run: |
          sudo apt update > /dev/null
          sudo apt install -y ${{ env.PACKAGES }} > /dev/null

      - name: 同步仓库
        uses: actions/checkout@v4
        with:
          path: kernel

      # 集成 KernelSU (SoDebug 版，手动链接)
      - name: 集成 KernelSU
        working-directory: kernel
        run: |
          # 克隆 SoDebug/KernelSU 仓库
          git clone https://github.com/SoDebug/KernelSU.git KernelSU_SRC
          cd KernelSU_SRC
          # 获取 kernelsu_id (commit hash)
          KSU_ID=$(git show -s --format='%h')
          # 计算 kernelsu_version (与第二份工作流一致)
          GIT_COUNT=$(git rev-list --count HEAD)
          KSU_VERSION=$((10000 + GIT_COUNT + 200))
          cd ..

          # 记录版本信息供后续步骤使用
          echo "KERNELSU_ID=$KSU_ID" >> $GITHUB_ENV
          echo "KERNELSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 将 KernelSU 内核源码集成到 drivers/staging/kernelsu
          rm -rf drivers/staging/kernelsu
          mkdir -p drivers/staging/kernelsu
          ln -sf ../../../KernelSU_SRC/kernel drivers/staging/kernelsu/KernelSU
          cp KernelSU_SRC/kernel/Makefile drivers/staging/kernelsu/Makefile
          cp KernelSU_SRC/kernel/Kconfig drivers/staging/kernelsu/Kconfig

          # 在 drivers/Kconfig 中添加 source（如果尚未添加）
          if ! grep -q "source \"drivers/staging/kernelsu/Kconfig\"" drivers/Kconfig; then
            echo 'source "drivers/staging/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          # 可选：克隆 setup 分支获取管理器 APK（后面单独下载官方版，此处不需要）
          echo "KernelSU integration from SoDebug/KernelSU completed (id=$KSU_ID, version=$KSU_VERSION)"

      - name: 缓存 Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载 Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang &&
          curl -LSs "https://github.com/Geeeeeker/boot/releases/download/clang-prebuilts-20260319-031015/clang-r383902b.tar.gz" |
          tar xz -C clang

      - name: 缓存 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ matrix.device }}
          restore-keys: kernel-${{ matrix.device }}
          max-size: 5G

      # 配置内核基础参数（包含 Kprobes / KernelSU / Binder / USB/IP 内建 / USB串口等）
      - name: 配置内核基础参数
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/dipper-mi845_defconfig"

          # ========== KernelSU 相关配置 ==========
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          # 禁用 MODVERSIONS（KernelSU 要求）
          sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' $DEFCONFIG
          echo "# CONFIG_MODVERSIONS is not set" >> $DEFCONFIG

          # ========== OverlayFS / Docker ==========
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

          # ========== 禁用 LTO ==========
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' $DEFCONFIG
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' $DEFCONFIG
          sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' $DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG

          # ========== 其他 ==========
          echo "CONFIG_CC_WERROR=n" >> $DEFCONFIG
          echo "CONFIG_ASHMEM=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_COMPAT=y" >> $DEFCONFIG
          echo "CONFIG_EPOLL=y" >> $DEFCONFIG
          echo "CONFIG_EVENTFD=y" >> $DEFCONFIG
          echo "CONFIG_SIGNALFD=y" >> $DEFCONFIG
          echo "CONFIG_INOTIFY_USER=y" >> $DEFCONFIG
          echo "CONFIG_SHMEM=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG

          # ========== USB/IP 内建 ==========
          echo "CONFIG_USBIP_CORE=y" >> $DEFCONFIG
          echo "CONFIG_USBIP_VHCI_HCD=y" >> $DEFCONFIG
          echo "CONFIG_USBIP_HOST=y" >> $DEFCONFIG

          # ========== Binder 支持 ==========
          echo "CONFIG_ANDROID_BINDER_IPC=y" >> $DEFCONFIG
          echo "CONFIG_ANDROID_BINDERFS=y" >> $DEFCONFIG

          # ========== USB 串口支持 ==========
          echo "CONFIG_USB_SERIAL=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CONSOLE=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_GENERIC=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CH341=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_FTDI_SIO=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CP210X=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_PL2303=y" >> $DEFCONFIG

          # ========== Backlight ==========
          echo "CONFIG_BACKLIGHT_CLASS_DEVICE=y" >> $DEFCONFIG
          echo "CONFIG_BACKLIGHT_QCOM=y" >> $DEFCONFIG

          # ========== zram / zstd ==========
          echo "CONFIG_ZRAM=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_ZSTD=y" >> $DEFCONFIG

      - name: 配置 LXC 和 Docker 支持
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/dipper-mi845_defconfig"
          rm -rf utils
          git clone https://github.com/tomxi1997/lxc-docker-support-for-android.git utils
          # 移除强制选中项
          sed -i '/select CFS_BANDWIDTH/d' utils/Kconfig
          sed -i '/select DOCKER_STATISTICS/d' utils/Kconfig
          sed -i '/select BLK_DEV_THROTTLING/d' utils/Kconfig
          sed -i '/select CFQ_GROUP_IOSCHED/d' utils/Kconfig
          sed -i '/select BRIDGE_VLAN_FILTERING/d' utils/Kconfig

          echo 'source "utils/Kconfig"' >> "Kconfig"
          echo "CONFIG_DOCKER=y" >> $DEFCONFIG

          # 禁用冲突特性
          echo "# CONFIG_CFS_BANDWIDTH is not set" >> $DEFCONFIG
          echo "# CONFIG_DOCKER_STATISTICS is not set" >> $DEFCONFIG
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' $DEFCONFIG
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> $DEFCONFIG
          echo "# CONFIG_BLK_DEV_THROTTLING is not set" >> $DEFCONFIG
          echo "# CONFIG_CFQ_GROUP_IOSCHED is not set" >> $DEFCONFIG

          # 修复设备树错误
          sed -i '/sdm845-v2-qvr-evt.dtb/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/qvr/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/interposer/d' arch/arm64/boot/dts/qcom/Makefile

          # 应用 runc/qtaguid 补丁
          chmod +x utils/runcpatch.sh
          if [ -f kernel/cgroup/cgroup.c ]; then
              sh utils/runcpatch.sh kernel/cgroup/cgroup.c
          fi
          if [ -f kernel/cgroup.c ]; then
              sh utils/runcpatch.sh kernel/cgroup.c
          fi
          if [ -f net/netfilter/xt_qtaguid.c ]; then
              patch -p0 < utils/xt_qtaguid.patch
          fi

      - name: 编译内核
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KBUILD_BUILD_USER=${{ github.repository_owner }}
          export KBUILD_BUILD_HOST=github-runner
          export KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$(git log -1 --format=%at)" +"%a %b %d %H:%M:%S %Z %Y")
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make -j$(nproc --all) \
            CC="ccache clang" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            KCFLAGS="-Wno-unknown-warning-option" \
            dipper-mi845_defconfig all

      # ========== 编译 USB/IP 用户态工具（保留） ==========
      - name: 设置 QEMU 用户态支持
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: 编译 USB/IP 用户态工具 (Docker 容器)
        run: |
          mkdir -p usbip-out/{bin,libs}
          docker run --rm --platform linux/arm64 \
            --memory=4g \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/usbip-out:/output \
            -w /workspace/kernel \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              ulimit -s unlimited
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev:arm64 \
                libssl-dev:arm64 \
                flex \
                bison \
                bc \
                libelf-dev \
                file \
                patchelf

              export ARCH=arm64
              export CROSS_COMPILE=aarch64-linux-gnu-
              export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

              cd tools/usb/usbip
              ./autogen.sh
              ./configure \
                CFLAGS=\"-Wno-error -Wno-error=stringop-truncation \
                         -I/workspace/kernel/out/include \
                         -I/workspace/kernel/out/arch/arm64/include/generated \
                         -I/workspace/kernel/arch/arm64/include\" \
                --with-tcp-wrappers=no
              make -j1

              cp src/.libs/usbip /output/bin/
              cp src/.libs/usbipd /output/bin/
              cp libsrc/.libs/libusbip.so.0* /output/libs/

              cd /output
              BINARIES=\"bin/usbip bin/usbipd libs/libusbip.so.0*\"
              DEPS=\"\"
              for file in \$BINARIES; do
                if [ -f \"\$file\" ]; then
                  echo \"Collecting dependencies for \$file...\"
                  needed=\$(readelf -d \"\$file\" | grep NEEDED | awk '{print \$5}' | tr -d '[]' || true)
                  for lib in \$needed; do
                    if [[ \"\$DEPS\" != *\"\$lib\"* ]]; then
                      DEPS=\"\$DEPS \$lib\"
                    fi
                  done
                fi
              done
              for lib in \$(echo \$DEPS | tr ' ' '\\n' | sort -u); do
                echo \"Searching for library: \$lib\"
                libpath=\$(ldconfig -p | grep \"\$lib (\" | head -1 | awk '{print \$NF}' || true)
                if [ -z \"\$libpath\" ]; then
                  libpath=\$(find /lib /usr/lib -name \"\$lib\" -type f 2>/dev/null | head -1 || true)
                fi
                if [ -n \"\$libpath\" ]; then
                  echo \"Found: \$libpath\"
                  cp -P \"\$libpath\" libs/ 2>/dev/null || cp \"\$libpath\" libs/
                  for reallib in \$(find \"\$(dirname \"\$libpath\")\" -name \"\${lib%.so*}*\" -type f 2>/dev/null); do
                    cp -n \"\$reallib\" libs/ 2>/dev/null || true
                  done
                else
                  echo \"Warning: library \$lib not found\"
                fi
              done
              ld_linux=\"/lib/ld-linux-aarch64.so.1\"
              if [ -f \"\$ld_linux\" ]; then
                cp -P \"\$ld_linux\" libs/
              fi
              echo \"USB/IP user-space tools build complete.\"
            "

      - name: 打包 USB/IP 产物
        run: |
          cd usbip-out
          tar czf ../usbip-arm64-bundle.tar.gz .
          cd ..

      - name: 上传 USB/IP 捆绑包 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: usbip-arm64-bundle
          path: usbip-arm64-bundle.tar.gz

      # ========== 下载 KernelSU 管理器 APK ==========
      - name: Download KernelSU Manager APK
        run: |
          LATEST_RELEASE_URL=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | grep "browser_download_url.*\.apk" | cut -d '"' -f 4)
          if [ -n "$LATEST_RELEASE_URL" ]; then
            wget -O KernelSU-Manager.apk "$LATEST_RELEASE_URL"
          else
            echo "Failed to fetch KernelSU APK."
            exit 1
          fi
          mkdir -p apk-output
          cp KernelSU-Manager.apk apk-output/

      # ========== 打包 AnyKernel3 ==========
      - name: 打包 (AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          cp kernel/out/arch/arm64/boot/dtbo.img ak3/ || true
          cp apk-output/KernelSU-Manager.apk ak3/
          cd ak3
          cat >anykernel.sh <<EOF
          properties() { '
          kernel.string=Kernel for ${{ matrix.device }} with KernelSU ${{ env.KERNELSU_VERSION }}
          device.name1=${{ matrix.device }}
          do.devicecheck=1
          '; }
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          is_slot_device=auto
          block=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF
          zip -qr9 Anykernel3-${{ matrix.device }}.zip * -x .git .github README.md *placeholder

      - name: 打包 (boot.img)
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg --depth=1 mkbootimg
          cp kernel/out/arch/arm64/boot/Image.gz-dtb mkbootimg/
          cd mkbootimg
          boot_url=$(curl -LSs https://download.lineageos.org/api/v2/devices/${{ matrix.device }}/builds | jq -r '.[0].files[1].url')
          curl -LSs $boot_url -o boot.img
          mkbootimg_args=$(./unpack_bootimg.py --out out --boot_img boot.img --format mkbootimg)
          mv Image.gz-dtb out/kernel
          eval "./mkbootimg.py $mkbootimg_args -o boot-lineage-${{ matrix.device }}.img"

      - name: 上传 AnyKernel3 安装包
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}-ak3
          path: ak3/Anykernel3-${{ matrix.device }}.zip

      - name: 上传 boot 镜像
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}-boot
          path: mkbootimg/boot-lineage-${{ matrix.device }}.img

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager
          path: apk-output/KernelSU-Manager.apk

  release:
    name: 发布
    permissions: { contents: write }
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 获取构建产物
        uses: actions/download-artifact@v4
        with:
          path: kernel
          pattern: kernel-*
          merge-multiple: true

      - name: 获取 USB/IP 捆绑包
        uses: actions/download-artifact@v4
        with:
          name: usbip-arm64-bundle
          path: usbip

      - name: 获取 APK
        uses: actions/download-artifact@v4
        with:
          name: KernelSU-Manager
          path: manager

      - name: 获取当前时间
        id: time
        run: |
          echo "time=$(TZ='Asia/Shanghai' date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'dev/') }}
          files: |
            kernel/*
            usbip/usbip-arm64-bundle.tar.gz
            manager/KernelSU-Manager.apk

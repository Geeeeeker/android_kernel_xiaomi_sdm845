name: Build static usbip for arm64

on:
  workflow_dispatch:   # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip in arm64 container
        run: |
          mkdir -p ${{ github.workspace }}/output

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译依赖（arm64 原生库）
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev \
                libssl-dev \
                flex \
                bison \
                libncurses-dev \
                wget \
                xz-utils

              # 下载内核源码
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar -xf linux-4.9.337.tar.xz

              # 进入 usbip 源码目录
              cd linux-4.9.337/tools/usb/usbip

              # 生成 configure 脚本
              ./autogen.sh

              # 设置 pkg-config 路径，确保找到 libudev.pc
              export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH

              # 获取静态链接 udev 所需的完整 flags
              echo '=== udev static link flags ==='
              UDEV_STATIC_LIBS=\$(pkg-config --static --libs libudev)
              UDEV_CFLAGS=\$(pkg-config --cflags libudev)
              echo \"UDEV_LIBS=\$UDEV_STATIC_LIBS\"
              echo \"UDEV_CFLAGS=\$UDEV_CFLAGS\"

              # 将 flags 导出，configure 会优先使用这些环境变量
              export UDEV_CFLAGS=\"\$UDEV_CFLAGS\"
              export UDEV_LIBS=\"\$UDEV_STATIC_LIBS\"

              # 配置（静态编译）
              ./configure CFLAGS='-static' LDFLAGS='-static' --with-tcp-wrappers=no

              # 编译（使用所有 CPU 核心）
              make -j\$(nproc)

              # 将编译好的二进制复制到输出目录
              cp src/usbip /workspace/output/
              cp src/usbipd /workspace/output/
            "

      - name: Verify binaries
        run: |
          file output/usbip
          file output/usbipd
          # 期望输出：ELF 64-bit LSB executable, ARM aarch64, statically linked

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: output/

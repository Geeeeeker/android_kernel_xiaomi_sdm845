name: Build static usbip for arm64

on:
  workflow_dispatch:   # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip in arm64 container
        run: |
          # 创建工作区内的输出目录
          mkdir -p ${{ github.workspace }}/output

          # 运行 arm64 Ubuntu 22.04 容器，挂载工作区，执行编译
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译依赖（arm64 原生库）
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev \
                libssl-dev \
                flex \
                bison \
                libncurses-dev \
                wget \
                xz-utils

              # 下载内核源码
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar -xf linux-4.9.337.tar.xz

              # 进入 usbip 源码目录
              cd linux-4.9.337/tools/usb/usbip

              # 静态编译
              ./autogen.sh
              ./configure CFLAGS='-static' LDFLAGS='-static' --with-tcp-wrappers=no
              make -j\$(nproc)

              # 将编译好的二进制复制到输出目录
              cp src/usbip /workspace/output/
              cp src/usbipd /workspace/output/
            "

      - name: Verify binaries
        run: |
          file output/usbip
          file output/usbipd
          # 应显示：ELF 64-bit LSB executable, ARM aarch64, statically linked

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: output/

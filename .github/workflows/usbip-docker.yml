# ------------------------------------------------------------
# 1. 编译安装 eudev (提供 libudev 静态库) - 使用 GitHub 源
# ------------------------------------------------------------
cd /tmp
wget https://github.com/eudev-project/eudev/archive/refs/tags/v3.2.14.tar.gz -O eudev-3.2.14.tar.gz
tar xzf eudev-3.2.14.tar.gz
# 注意：GitHub 下载的源码解压后目录名可能不同，通常是 eudev-3.2.14
cd eudev-3.2.14
# 后续的 ./configure 等命令保持不变
./configure --prefix=/usr --libdir=/usr/lib/aarch64-linux-gnu --enable-static --disable-shared
make -j$(nproc)
make install

# ------------------------------------------------------------
# 2. 编译安装 OpenSSL (如果原有下载地址也失效，可一并替换)
# ------------------------------------------------------------
cd /tmp
# 使用 GitHub 上 OpenSSL 的官方镜像（版本 1.1.1w 是支持的 LTS 版本）
wget https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz -O openssl-1.1.1w.tar.gz
tar xzf openssl-1.1.1w.tar.gz
cd openssl-OpenSSL_1_1_1w
# 后续的 ./config 命令保持不变
./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib/aarch64-linux-gnu no-shared
make -j$(nproc)
make install

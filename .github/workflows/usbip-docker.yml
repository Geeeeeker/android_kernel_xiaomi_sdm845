name: Build static usbip for arm64 (QEMU + ARM64 container)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip in arm64 container
        run: |
          mkdir -p ${{ github.workspace }}/output

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译依赖（包括静态库）
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev \
                libssl-dev \
                flex \
                bison \
                libncurses-dev \
                wget \
                xz-utils \
                libudev-static \
                libssl-static

              # 如果静态库包不存在（Ubuntu 官方仓库可能没有），则从源码编译 libudev
              # 这里我们假设包存在；若不存在，需要额外处理（见下文注释）

              # 下载内核源码
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar -xf linux-4.9.337.tar.xz

              # 进入 usbip 源码目录
              cd linux-4.9.337/tools/usb/usbip

              # 生成 configure 脚本
              ./autogen.sh

              # 获取静态链接 udev 和 ssl 所需的完整 flags
              echo '=== udev static link flags ==='
              UDEV_STATIC_LIBS=\$(pkg-config --static --libs libudev)
              echo \"UDEV_STATIC_LIBS=\$UDEV_STATIC_LIBS\"

              echo '=== libssl static link flags ==='
              SSL_STATIC_LIBS=\$(pkg-config --static --libs libssl)
              echo \"SSL_STATIC_LIBS=\$SSL_STATIC_LIBS\"

              # 配置（静态编译）
              # 将静态库标志添加到 LDFLAGS，同时保留 -static
              ./configure \
                CFLAGS=\"-static\" \
                LDFLAGS=\"-static \$UDEV_STATIC_LIBS \$SSL_STATIC_LIBS\" \
                --with-tcp-wrappers=no \
                --host=aarch64-linux-gnu

              # 编译（使用所有 CPU 核心）
              make -j\$(nproc)

              # 将编译好的二进制复制到输出目录
              cp src/usbip /workspace/output/
              cp src/usbipd /workspace/output/
            "

      - name: Verify binaries
        run: |
          file output/usbip
          file output/usbipd
          echo "=== Dynamic dependencies (should be none) ==="
          aarch64-linux-gnu-readelf -d output/usbip | grep NEEDED || echo "usbip is statically linked"
          aarch64-linux-gnu-readelf -d output/usbipd | grep NEEDED || echo "usbipd is statically linked"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: output/

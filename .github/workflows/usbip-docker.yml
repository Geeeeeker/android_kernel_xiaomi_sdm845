name: Build dynamic usbip for arm64 (QEMU + container)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip in arm64 container (dynamic linking)
        run: |
          mkdir -p ${{ github.workspace }}/output

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译依赖（arm64 原生库，动态版本）
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev:arm64 \
                libssl-dev:arm64 \
                flex \
                bison \
                libncurses-dev \
                wget \
                xz-utils

              # 下载内核源码
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar -xf linux-4.9.337.tar.xz

              # 进入 usbip 源码目录
              cd linux-4.9.337/tools/usb/usbip

              # 生成 configure 脚本
              ./autogen.sh

              # 配置（动态编译，禁用警告转错误）
              ./configure \
                CFLAGS=\"-Wno-error -Wno-error=stringop-truncation\" \
                --with-tcp-wrappers=no

              # 编译（使用所有 CPU 核心）
              make -j\$(nproc)

              # 将编译好的二进制复制到输出目录
              cp src/usbip /workspace/output/
              cp src/usbipd /workspace/output/
            "

      - name: Install aarch64 binutils for verification
        run: sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Verify binaries are dynamically linked
        run: |
          file output/usbip
          file output/usbipd
          echo "=== Dynamic dependencies ==="
          aarch64-linux-gnu-readelf -d output/usbip | grep NEEDED
          aarch64-linux-gnu-readelf -d output/usbipd | grep NEEDED

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-dynamic-arm64
          path: output/

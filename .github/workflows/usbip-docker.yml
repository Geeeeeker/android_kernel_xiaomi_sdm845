name: Build static usbip for arm64 (QEMU + container, compile deps from source)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip in arm64 container
        run: |
          mkdir -p ${{ github.workspace }}/output

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装基础编译工具
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                wget \
                xz-utils \
                flex \
                bison \
                libncurses-dev \
                git \
                ca-certificates

              # ------------------------------------------------------------
              # 1. 编译安装 eudev (提供 libudev 静态库)
              # ------------------------------------------------------------
              cd /tmp
              wget https://dev.gentoo.org/~blueness/eudev/eudev-3.2.14.tar.gz
              tar xzf eudev-3.2.14.tar.gz
              cd eudev-3.2.14
              # 配置为静态编译并安装到系统目录
              ./configure --prefix=/usr --libdir=/usr/lib/aarch64-linux-gnu --enable-static --disable-shared
              make -j\$(nproc)
              make install

              # ------------------------------------------------------------
              # 2. 编译安装 OpenSSL (提供 libssl, libcrypto 静态库)
              # ------------------------------------------------------------
              cd /tmp
              wget https://www.openssl.org/source/openssl-1.1.1w.tar.gz
              tar xzf openssl-1.1.1w.tar.gz
              cd openssl-1.1.1w
              # 配置为仅生成静态库，安装到系统目录
              ./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib/aarch64-linux-gnu no-shared
              make -j\$(nproc)
              make install

              # ------------------------------------------------------------
              # 3. 下载内核源码并编译 usbip
              # ------------------------------------------------------------
              cd /workspace
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar xf linux-4.9.337.tar.xz
              cd linux-4.9.337/tools/usb/usbip

              # 生成 configure 脚本
              ./autogen.sh

              # 配置静态编译
              # 注意：pkg-config 会自动找到我们刚刚安装的静态库（因为 .pc 文件也已安装）
              ./configure \
                CFLAGS=\"-static\" \
                LDFLAGS=\"-static\" \
                --with-tcp-wrappers=no

              # 编译（使用所有核心）
              make -j\$(nproc)

              # 将生成的二进制复制到输出目录
              cp src/usbip /workspace/output/
              cp src/usbipd /workspace/output/
            "

      - name: Install aarch64 binutils for verification
        run: sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Verify binaries are statically linked
        run: |
          file output/usbip
          file output/usbipd
          echo "=== Dynamic dependencies (should be none) ==="
          aarch64-linux-gnu-readelf -d output/usbip | grep NEEDED || echo "usbip is statically linked"
          aarch64-linux-gnu-readelf -d output/usbipd | grep NEEDED || echo "usbipd is statically linked"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbip-static-arm64
          path: output/

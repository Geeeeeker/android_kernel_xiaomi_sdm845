name: Build usbip tools + kernel modules for arm64 with deps

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip tools and kernel modules in arm64 container
        run: |
          mkdir -p ${{ github.workspace }}/output/{bin,libs,modules}

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译依赖
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev:arm64 \
                libssl-dev:arm64 \
                flex \
                bison \
                libncurses-dev \
                wget \
                xz-utils \
                kmod \
                patchelf \
                file

              # 下载内核源码
              wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.337.tar.xz
              tar -xf linux-4.9.337.tar.xz
              cd linux-4.9.337

              # 生成内核配置（启用 USB/IP 模块）
              make ARCH=arm64 defconfig
              # 手动开启 USB/IP 相关选项（使用脚本或直接写入 .config）
              echo 'CONFIG_USBIP_CORE=m' >> .config
              echo 'CONFIG_USBIP_VHCI_HCD=m' >> .config
              # 如有需要可启用调试
              # echo 'CONFIG_USBIP_DEBUG=y' >> .config
              # 更新依赖
              make ARCH=arm64 olddefconfig

              # 编译内核模块（仅编译 drivers/usb/usbip/ 下的模块）
              make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
              make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/usb/usbip modules

              # 复制生成的 .ko 文件到输出目录
              find drivers/usb/usbip -name '*.ko' -exec cp {} /workspace/output/modules/ \\;

              # 编译 usbip 用户态工具
              cd tools/usb/usbip
              ./autogen.sh
              ./configure \
                CFLAGS=\"-Wno-error -Wno-error=stringop-truncation\" \
                --with-tcp-wrappers=no
              make -j\$(nproc)

              # 创建输出目录并复制用户态二进制
              mkdir -p /workspace/output/bin
              cp src/.libs/usbip /workspace/output/bin/
              cp src/.libs/usbipd /workspace/output/bin/

              # 复制 libusbip.so 库
              cp libsrc/.libs/libusbip.so.0* /workspace/output/libs/

              # 收集所有动态库依赖
              cd /workspace/output
              BINARIES=\"bin/usbip bin/usbipd libs/libusbip.so.0*\"
              DEPS=\"\"

              for file in \$BINARIES; do
                if [ -f \"\$file\" ]; then
                  echo \"Collecting dependencies for \$file...\"
                  needed=\$(aarch64-linux-gnu-readelf -d \"\$file\" | grep NEEDED | awk '{print \$5}' | tr -d '[]' || true)
                  for lib in \$needed; do
                    if [[ \"\$DEPS\" != *\"\$lib\"* ]]; then
                      DEPS=\"\$DEPS \$lib\"
                    fi
                  done
                fi
              done

              # 去重并复制库文件
              for lib in \$(echo \$DEPS | tr ' ' '\\n' | sort -u); do
                echo \"Searching for library: \$lib\"
                libpath=\$(ldconfig -p | grep \"\$lib (\" | head -1 | awk '{print \$NF}' || true)
                if [ -z \"\$libpath\" ]; then
                  libpath=\$(find /lib /usr/lib -name \"\$lib\" -type f 2>/dev/null | head -1 || true)
                fi
                if [ -n \"\$libpath\" ]; then
                  echo \"Found: \$libpath\"
                  cp -P \"\$libpath\" libs/ 2>/dev/null || cp \"\$libpath\" libs/
                  for reallib in \$(find \"\$(dirname \"\$libpath\")\" -name \"\${lib%.so*}*\" -type f 2>/dev/null); do
                    cp -n \"\$reallib\" libs/ 2>/dev/null || true
                  done
                else
                  echo \"Warning: library \$lib not found\"
                fi
              done

              # 确保 ld-linux 被复制
              ld_linux=\"/lib/ld-linux-aarch64.so.1\"
              if [ -f \"\$ld_linux\" ]; then
                cp -P \"\$ld_linux\" libs/
              fi

              echo \"Build and collection complete.\"
            "

      - name: Install aarch64 binutils for verification
        run: sudo apt-get install -y binutils-aarch64-linux-gnu file

      - name: Verify collected files
        run: |
          echo "=== Binaries ==="
          file output/bin/usbip output/bin/usbipd
          echo "=== Libraries ==="
          ls -la output/libs/
          echo "=== Kernel modules ==="
          file output/modules/*.ko || echo "No modules found?"
          echo "=== Dependencies of usbip ==="
          LD_LIBRARY_PATH=output/libs aarch64-linux-gnu-readelf -d output/bin/usbip | grep NEEDED

      - name: Create distribution archive
        run: |
          cd output
          tar czf ../usbip-arm64-bundle-with-modules.tar.gz .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usbip-arm64-with-modules-and-deps
          path: usbip-arm64-bundle-with-modules.tar.gz
